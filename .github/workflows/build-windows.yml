name: Build Windows application

on:
  workflow_dispatch:
  push:
    branches: [ main, master, ht-dsp ]

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Check out project
        uses: actions/checkout@v5

      - name: Validate mobile remote JavaScript
        shell: pwsh
        run: |
          $source = Get-Content Source/RemotePage.h -Raw
          $script = [regex]::Match($source, '(?s)<script>(.*?)</script>')
          if (-not $script.Success) { throw 'Embedded mobile script not found' }
          $javascript = $script.Groups[1].Value -replace '\)DSP_HTML"\s*R"DSP_HTML\(', ''
          Set-Content -Path remote-check.js -Value $javascript -Encoding utf8
          node --check remote-check.js

      - name: Configure JUCE project
        shell: pwsh
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DBUILD_TESTING=ON

      - name: Build Windows application and DSP tests
        shell: pwsh
        run: cmake --build build --config Release --parallel 4

      - name: Run DSP tests
        shell: pwsh
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package runnable app
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path package | Out-Null
          $exe = 'build/SimpleDSP_artefacts/Release/SimpleDSP.exe'
          if (-not (Test-Path $exe -PathType Leaf)) { throw 'SimpleDSP.exe was not found after compiling.' }
          Copy-Item $exe -Destination 'package/SimpleDSP.exe'
          $version = [regex]::Match((Get-Content CMakeLists.txt -Raw), 'project\(SimpleDSP VERSION ([\d.]+)').Groups[1].Value
          if (-not $version) { throw 'SimpleDSP project version was not found.' }
          @"
          SimpleDSP - WINDOWS v$version

          Run "SimpleDSP.exe" on Windows 10/11 (64-bit).
          No Visual Studio, compiler or .NET runtime is required on your PC.
          ASIO requires your audio interface manufacturer's Windows driver.
          Choose your driver, then choose distinct output channels for both channels.
          No summing or cross-mixing is performed by the application.
          Includes 6 PEQs, high/low-pass filters, input sample-peak and output true-peak meters, input/output RTAs, collapsible EQ controls, channel names, presets, and a Wi-Fi remote.
          The remote address appears in the Windows application; PIN is optional.
          Windows autostart activates at user sign-in, not before login.

          NOT PRODUCTION-VALIDATED: first test at low level with speakers muted.
          No output limiter or clipping protection is implemented.
          "@ | Set-Content -Path 'package/READ_ME_FIRST.txt' -Encoding UTF8

      - name: Attach ready-to-download Windows app
        uses: actions/upload-artifact@v4
        with:
          name: SimpleDSP-Windows-x64
          path: package/
          if-no-files-found: error
          retention-days: 30
