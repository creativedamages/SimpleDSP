name: Build Raspberry Pi 4 application (ARM64)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/raspberry-pi-headless-arm64
    paths:
      - 'pi/**'
      - 'Source/DSP.h'
      - 'Source/Analysis.h'
      - 'Source/RemoteServer.h'
      - 'Source/RemotePage.h'
      - 'tests/**'
      - 'assets/**'
      - '.github/workflows/build-raspberry-pi.yml'

permissions:
  contents: read

jobs:
  raspberry-pi-4:
    runs-on: ubuntu-24.04-arm
    # Build against Debian 12/bookworm glibc, so the artifact runs on
    # 64-bit Raspberry Pi OS Bookworm and newer releases (not just Ubuntu 24).
    container: debian:bookworm
    timeout-minutes: 50
    steps:
      - name: Install ARM64 build dependencies
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            git ca-certificates cmake ninja-build g++ make pkg-config \
            libasound2-dev libfreetype6-dev libfontconfig1-dev \
            libx11-dev libxext-dev libxinerama-dev libxrandr-dev \
            libxcursor-dev libgl1-mesa-dev libpng-dev python3 nodejs file curl

      - name: Checkout source
        uses: actions/checkout@v5

      - name: Validate mobile web JavaScript
        run: |
          python3 - <<'PY'
          import pathlib, re
          text = pathlib.Path("Source/RemotePage.h").read_text(encoding="utf-8")
          js = text.split("<script>", 1)[1].split("</script>", 1)[0]
          js = re.sub(r'\)DSP_HTML"\s*R"DSP_HTML\(', '', js)
          pathlib.Path("remote-check.js").write_text(js, encoding="utf-8")
          PY
          node --check remote-check.js

      - name: Configure Raspberry Pi console app
        run: cmake -S pi -B build-pi -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON

      - name: Compile native ARM64 executable and tests
        run: cmake --build build-pi --parallel 4

      - name: Run DSP tests
        run: ctest --test-dir build-pi --output-on-failure

      - name: Smoke-test executable and configuration
        shell: bash
        run: |
          set -euo pipefail
          exe="$(find build-pi -type f \( -name 'SimpleDSPPi' -o -name 'Simple DSP Pi' \) -perm /111 | head -n 1)"
          test -n "$exe"
          file "$exe"
          "$exe" --help
          "$exe" --check-config --config "$PWD/pi/config.example.json"

      - name: Smoke-test phone remote, mute and startup preset (no audio)
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib, signal, subprocess, tempfile, time, urllib.request
          binary = next(p.resolve() for p in pathlib.Path('build-pi').rglob('*') if p.is_file() and p.name in ('SimpleDSPPi', 'Simple DSP Pi') and os.access(p, os.X_OK))
          with tempfile.TemporaryDirectory() as root:
              home = pathlib.Path(root)
              cfg = json.loads(pathlib.Path('pi/config.example.json').read_text())
              cfg['remote_pin'] = '123456'
              cfg['remote_pin_required'] = True
              cfg['bind_address'] = '127.0.0.1'
              cfg['start_muted'] = True
              cfg['http_port'] = 18765
              path = home / 'config.json'
              path.write_text(json.dumps(cfg))
              env = dict(os.environ, HOME=str(home))
              p = subprocess.Popen([str(binary), '--no-audio', '--config', str(path)], env=env, stdout=subprocess.PIPE, stderr=subprocess.STDOUT)
              def req(endpoint, body=None):
                  data = None if body is None else json.dumps(body).encode()
                  request = urllib.request.Request('http://127.0.0.1:18765' + endpoint, data=data,
                      headers={'X-DSP-PIN': '123456', 'Content-Type': 'application/json'})
                  with urllib.request.urlopen(request, timeout=3) as response:
                      return response.read().decode()
              try:
                  for _ in range(40):
                      if p.poll() is not None:
                          raise RuntimeError('Headless server exited early')
                      try:
                          state = json.loads(req('/api/state'))
                          break
                      except Exception:
                          time.sleep(.25)
                  else:
                      raise RuntimeError('Remote HTTP server did not start')
                  assert len(state['channels']) == 2
                  assert state['channels'][0]['outputMuted'] is True
                  req('/api/set', {'channel': 0, 'key': 'outputMuted', 'value': False})
                  assert json.loads(req('/api/state'))['channels'][0]['outputMuted'] is False
                  telem = json.loads(req('/api/telemetry'))
                  assert len(telem['channels']) == 2
                  assert len(telem['channels'][0]['inputRta']) == 128
                  req('/api/save', {'name': 'SmokePreset'})
                  preset = home / '.local/share/simple-dsp/Presets/SmokePreset.dsp.json'
                  assert preset.exists()
                  response = json.loads(req('/api/startup', {'name': 'SmokePreset'}))
                  assert response['ok'] and response['loadAtLaunch']
                  saved = json.loads(path.read_text())
                  assert saved['load_at_launch'] and saved['startup_preset'] == 'SmokePreset'
                  print('Remote HTTP, mute, telemetry, preset save and startup selection: PASS')
              finally:
                  p.send_signal(signal.SIGTERM)
                  try: p.communicate(timeout=8)
                  except subprocess.TimeoutExpired:
                      p.kill(); p.communicate()
                  assert p.returncode == 0, f'Server returned {p.returncode}'
          PY

      - name: Package installer and headless app
        shell: bash
        run: |
          set -euo pipefail
          exe="$(find build-pi -type f \( -name 'SimpleDSPPi' -o -name 'Simple DSP Pi' \) -perm /111 | head -n 1)"
          test -n "$exe"
          mkdir -p package
          cp "$exe" package/simple-dsp-pi
          chmod 755 package/simple-dsp-pi
          cp pi/install-pi.sh package/install-pi.sh
          chmod 755 package/install-pi.sh
          cp pi/config.example.json package/config.example.json
          cp pi/README-PI.md package/README-PI.md
          printf '%s\n' 'Compiled on Debian Bookworm ARM64. Requires Raspberry Pi OS 64-bit with ALSA.' > package/BUILD_INFO.txt

      - name: Upload Raspberry Pi download
        uses: actions/upload-artifact@v4
        with:
          name: SimpleDSP-RaspberryPi4-ARM64
          path: package/
          retention-days: 30
          if-no-files-found: error
